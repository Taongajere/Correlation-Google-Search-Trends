[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "correlation_google_search_trends"
version = "0.0.1"
description = "This is a research project for my Bsc Public Health at the Copperbelt University"
authors = [
  { name = "Taonga Jere" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["correlation_google_search_trends"]
force_sort_within_sections = true


